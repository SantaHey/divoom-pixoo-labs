<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixoo Drawer</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">16 × 16 PIXEL STUDIO</p>
          <h1>Dessine. Envoie.</h1>
        </div>
      </header>

      <section class="workspace">
        <canvas id="grid" width="512" height="512"></canvas>
        <aside>
          <h2>Couleurs</h2>
          <div id="palette" class="palette"></div>
          <div class="picker-box">
            <label for="color">Picker de couleur</label>
            <div class="color-row">
              <input id="color" type="color" value="#ffcc00" aria-label="Choisir une couleur">
              <button id="add-color">Ajouter à la palette</button>
            </div>
          </div>
          <h2>Outils</h2>
          <div id="tools" class="tools">
            <button data-tool="pencil" class="selected">✏️ Trait</button>
            <button data-tool="fill">🪣 Remplir</button>
            <button data-tool="circle">⭕ Cercle</button>
            <button data-tool="square">□ Carré</button>
          </div>
          <button id="clear" class="secondary">Tout effacer</button>
          <button id="send">Envoyer maintenant</button>
          <p id="status">Prêt.</p>
        </aside>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
